[project]
name = "transkript"
version = "0.1.0"
description = "Local meeting transcriber — records mic + system audio, transcribes with Whisper, saves to file."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "sounddevice>=0.5",
    "faster-whisper>=1.0",
    "numpy>=1.24",
]

[project.scripts]
transkript = "transkript.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
